<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900" role="img" aria-label="Why this project: RCON stays on the private network and is only reachable through the daemon over HTTP with an AuthKey">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6fd4"/>
    </marker>
  </defs>

  <rect width="1560" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="58" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17212b">Why this project? Keep RCON on the private network &#8212; expose only HTTP</text>

  <!-- ============ Before (danger) ============ -->
  <text x="40" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#c0392b">Before: RCON exposed directly to the internet (dangerous &#8212; don't do this)</text>

  <rect x="165" y="145" width="310" height="112" rx="14" fill="#fdecec" stroke="#d66b6b" stroke-width="2"/>
  <text x="320" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#a93226">Public scanners &amp; bots</text>
  <text x="320" y="219" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7b4a45">scan every port,</text>
  <text x="320" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7b4a45">24/7</text>

  <rect x="625" y="145" width="310" height="112" rx="14" fill="#fdecec" stroke="#d66b6b" stroke-width="2"/>
  <text x="780" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#a93226">RCON 25575 open</text>
  <text x="780" y="219" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7b4a45">anyone can connect and</text>
  <text x="780" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7b4a45">send arbitrary bytes</text>

  <rect x="1085" y="145" width="310" height="112" rx="14" fill="#fdecec" stroke="#d66b6b" stroke-width="2"/>
  <text x="1240" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#a93226">Game server</text>
  <text x="1240" y="219" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7b4a45">crashes on specific</text>
  <text x="1240" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7b4a45">byte sequences</text>

  <line x1="479" y1="201" x2="619" y2="201" stroke="#c0392b" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="550" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c0392b">junk bytes</text>

  <line x1="939" y1="201" x2="1079" y2="201" stroke="#c0392b" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="1010" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c0392b">crafted payload</text>

  <text x="165" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6b7280">Anyone on the internet can reach this port. One crafted payload can crash the server, and the password can be brute-forced.</text>

  <line x1="40" y1="340" x2="1520" y2="340" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ============ After (recommended) ============ -->
  <text x="40" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1e8449">After: RCON stays on the private network (recommended)</text>

  <rect x="165" y="420" width="310" height="118" rx="14" fill="#eef4ff" stroke="#8fb0e8" stroke-width="2"/>
  <text x="320" y="465" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f4e79">Your computer</text>
  <text x="320" y="494" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a5a6a">ICU RCON Client</text>
  <text x="320" y="515" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a5a6a">(or any HTTP client)</text>

  <rect x="625" y="420" width="310" height="118" rx="14" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2.5"/>
  <text x="780" y="465" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f4e79">ICURconDaemon</text>
  <text x="780" y="494" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a5a6a">same host or same intranet;</text>
  <text x="780" y="515" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a5a6a">AuthKey checked before dialing RCON</text>

  <rect x="1085" y="420" width="310" height="118" rx="14" fill="#eef4ff" stroke="#8fb0e8" stroke-width="2"/>
  <text x="1240" y="465" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f4e79">Game server</text>
  <text x="1240" y="494" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a5a6a">RCON on loopback / intranet</text>
  <text x="1240" y="515" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a5a6a">never exposed to the internet</text>

  <!-- hop 1: HTTP + AuthKey -->
  <line x1="479" y1="465" x2="619" y2="465" stroke="#3b6fd4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="550" y="452" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f4e79">HTTP + AuthKey</text>
  <line x1="619" y1="497" x2="479" y2="497" stroke="#3b6fd4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowBlue)"/>
  <text x="550" y="518" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280">response</text>

  <!-- hop 2: RCON -->
  <line x1="939" y1="465" x2="1079" y2="465" stroke="#3b6fd4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="1010" y="452" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f4e79">RCON</text>
  <line x1="1079" y1="497" x2="939" y2="497" stroke="#3b6fd4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowBlue)"/>
  <text x="1010" y="518" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280">response</text>

  <rect x="390" y="566" width="780" height="38" rx="10" fill="#f3f4f6"/>
  <text x="780" y="591" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">Firewall: port 25575 is never opened to the internet &#8212; the daemon reaches RCON over loopback / the intranet</text>

  <line x1="40" y1="636" x2="1520" y2="636" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ============ Summary ============ -->
  <text x="40" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17212b">The short version</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2933">
    <text x="40" y="720">&#8226; The RCON port is no longer reachable: scanners cannot find it, so crash payloads never arrive.</text>
    <text x="40" y="756">&#8226; Clients only speak HTTP to the daemon with a shared AuthKey &#8212; a wrong key is rejected before any RCON connection is opened.</text>
    <text x="40" y="792">&#8226; Interception is by identity, not by pattern: commands nobody has discovered yet are covered by the same gate.</text>
    <text x="40" y="828">&#8226; Interception happens in front of the protocol, so the daemon never has to recognize a bad command at all.</text>
    <text x="40" y="864">&#8226; One static binary per side, zero third-party dependencies, negligible relay overhead.</text>
  </g>
</svg>
