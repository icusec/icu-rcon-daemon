name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build daemon (Linux)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.Version=${{ github.event.inputs.version || 'dev' }}" -o ICURconDaemon-linux-amd64 .

      - name: Build daemon (Windows)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.Version=${{ github.event.inputs.version || 'dev' }}" -o ICURconDaemon-windows-amd64.exe .

      - name: Build client (Linux, Ubuntu 20.04 base for low glibc requirement)
        run: |
          docker run --rm -v "$PWD:/src" -w /src/client ubuntu:20.04 bash -e -c \
            "sed -i 's|old-releases.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list && \
             apt-get update -qq && \
             apt-get install -y -qq --no-install-recommends gcc pkg-config wget ca-certificates libgl1-mesa-dev xorg-dev > /dev/null && \
             wget -qO /tmp/go.tgz https://go.dev/dl/go1.24.0.linux-amd64.tar.gz && \
             tar -C /usr/local -xzf /tmp/go.tgz && \
             CGO_ENABLED=1 /usr/local/go/bin/go build -trimpath -ldflags '-s -w -X main.clientVersion=${{ github.event.inputs.version || 'dev' }}' -o ../ICURconClient-linux-amd64 ."

      - name: Build client (Windows)
        working-directory: client
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui -X main.clientVersion=${{ github.event.inputs.version || 'dev' }}" -o ../ICURconClient-windows-amd64.exe .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            ICURconDaemon-linux-amd64
            ICURconDaemon-windows-amd64.exe
            ICURconClient-linux-amd64
            ICURconClient-windows-amd64.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: |
            ICURconDaemon-linux-amd64
            ICURconDaemon-windows-amd64.exe
            ICURconClient-linux-amd64
            ICURconClient-windows-amd64.exe
